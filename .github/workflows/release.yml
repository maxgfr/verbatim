name: Release

# Conventional-Commit releases once CI is green on main.
#   release    semantic-release (feat → minor, fix → patch, ! → major): tag
#              and GitHub release with notes; no commit is pushed back.
#   binaries   the `verbatim` CLI built at that tag on native runners
#              (macOS arm64, Linux x64 and arm64), attested and attached to
#              the release. No Intel macOS build: ONNX Runtime ships no
#              prebuilt library for x86_64-apple-darwin.
#   checksums  SHA256SUMS for the attached binaries.
# maxgfr/homebrew-tap picks the binaries up from the release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: semantic-release
        id: release
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/commit-analyzer@13.0.1
          -p @semantic-release/release-notes-generator@14.1.1
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/github@12.0.10
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            name: verbatim-macos-arm64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: verbatim-linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: verbatim-linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun scripts/set-version.ts "$VERSION"
      - run: cargo build --release -p verbatim-cli --target ${{ matrix.target }}
      - run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/verbatim out/${{ matrix.name }}
          test "$(out/${{ matrix.name }} --version)" = "verbatim $VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ matrix.name }}
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v$VERSION" out/${{ matrix.name }} --clobber
      - run: (cd out && shasum -a 256 -- ${{ matrix.name }}) > "sums-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.name }}
          path: sums-${{ matrix.name }}.txt

  checksums:
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sums-*
          merge-multiple: true
      - run: |
          cat sums-*.txt | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/maxgfr/verbatim"
rust-version = "1.92"

[workspace.dependencies]
verbatim-edl = { path = "crates/edl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.verbatim-wasm]
opt-level = "s"
